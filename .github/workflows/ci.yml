name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # `prepare` builds dist/ during install, so the check below compares a
      # fresh build with what is committed.
      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # dist/ is committed on purpose: apps install this repo straight from git
      # and never build it. A stale dist/ ships the old code under the new
      # version number.
      - name: dist/ matches the source
        run: |
          npm run build
          git diff --exit-code -- dist
          test -z "$(git status --porcelain -- dist)"
